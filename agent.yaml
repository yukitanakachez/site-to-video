# agent.yaml: the whole agent in one file; see `starwish guide building-an-agent`.
name: site-to-video
display_name: Site to Video
version: 0.1.1                  # every publish needs a new one
description: "Send one public link (a website, a GitHub repo, or another public page) and choose wide or tall. Get back a 15–20 second narrated demo video with music, a thumbnail, and notes. One request makes one video."
price: 3200                     # whole stars per request: Yuki's choice (Task 14; costs.json: typical $0.92, heavy $2.63)
max_response_time: 18m          # Yuki's choice: the slowest dev run (11m48s) plus 50% (Task 14)
# The harness: Starwish's Claude Code preset on Opus. The instructions are prompt.md, generated by
# kit/build-prompt.mjs from prompt.src.md.
harness: { preset: claude-code, model: claude-opus-5-5 }
# The workspace VM: ffmpeg for the video checks, the npm packages for capture and render, and
# Remotion's own Chrome Headless Shell (spikes/FINDINGS.md: system Chrome crashed mid-render).
workspace: { install: "apt-get install -y ffmpeg && npm ci --omit=dev && npx remotion browser ensure" }
inputs:
  description: "One public link, and whether the video is wide (1920×1080) or tall (1080×1920). Optionally, a few wishes in the request text."
  params:
    type: object
    properties:
      url:
        type: string
        description: "The public page to film: a website, a GitHub repo, or another public page (http or https)."
        pattern: '^https?://\S+$'
      format:
        type: string
        description: "wide is 1920×1080 (landscape); tall is 1080×1920 (portrait)."
        enum: [wide, tall]
    required: [url, format]
    additionalProperties: false
    examples: [{ url: "https://github.com/sharkdp/hyperfine", format: "wide" }]
outputs:
  description: "demo.mp4 (the 15–20 second narrated video with music), poster.png (a thumbnail) and result.md (what the video shows and what was filmed)."
  files:
    - name: result.md
      type: text/markdown
      required: true
    - name: demo.mp4
      type: video/mp4
      required: true
    - name: poster.png
      type: image/png
      required: true
# The suite a version must pass before it is listed (spec 14.7's links): a landing page, the CLI
# repo with no site, and the web app with a public demo.
tests:
  - name: landing-page-wide
    request: "Make a demo video."
    params: { url: "https://www.raycast.com", format: "wide" }
    must: "returns demo.mp4 (15 to 20 seconds, with narration) of the given link, poster.png, and result.md listing the moments and the narration script"
  - name: cli-repo-tall
    request: "Make a demo video."
    params: { url: "https://github.com/sharkdp/hyperfine", format: "tall" }
    must: "returns demo.mp4 (15 to 20 seconds, with narration) of the given link, poster.png, and result.md listing the moments and the narration script"
  - name: demo-app-wide
    request: "Make a demo video."
    params: { url: "https://svelte.dev", format: "wide" }
    must: "returns demo.mp4 (15 to 20 seconds, with narration) of the given link, poster.png, and result.md listing the moments and the narration script"
# The only paid call in a job. Each runs in the harness VM with the ElevenLabs key; the workspace
# never sees it. Its files are inputs to the renderer only and are never delivered as outputs.
tools:
  - name: make-audio
    run: ./tools/make-audio
    description: Makes the narration and the music with ElevenLabs. Each call is paid; make each kind once, and once more only if the first is unusable.
    credentials:
      ELEVENLABS_API_KEY: { hosts: [api.elevenlabs.io], header: "xi-api-key: {value}" }
    actions:
      - name: voice
        description: "Narration with word timings. voice_id is one id from the shot list; text is at most 80 words and 540 characters. ElevenLabs speaks it at up to speed 1.2 and the renderer then sets this take's tempo from its own speaking rate, so it is heard at the video's pace. Saves voice.mp3 and voice-alignment.json and answers with planSec, the narration's length in plan-seconds (the shot list's unit)."
        args: ["voice", "{voice_id}", "{text}"]
      - name: music
        description: "An instrumental music bed. prompt is at most 200 characters, mood, tempo and instruments only: never an artist, song, album, label, publisher or lyrics, and no quotes or the words by, song, album, artist, lyrics, in the style of (a blunt filter refuses them, with no call made). seconds is the finished video's length (the shot list's durationSec divided by the pace), clamped to 15 to 22; the tool asks ElevenLabs for 8 s more, because a bed winds down over its last seconds. Saves music.mp3."
        args: ["music", "{prompt}", "{seconds}"]
