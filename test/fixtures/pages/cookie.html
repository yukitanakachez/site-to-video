<!doctype html>
<html><head><meta charset="utf-8"><title>Cookie fixture</title>
<style>body{font-family:sans-serif;margin:0}#banner{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:16px}</style></head><body>
<h1>Cookie fixture product</h1>
<p>This page helps small teams plan releases together and see what is blocked without opening a long meeting on Monday morning. It has plenty of words so it is never mistaken for an empty page.</p>
<div id="banner"><span>We use cookies to improve your experience.</span>
<button id="a" onclick="c('accept')">Accept all</button>
<button id="r" onclick="c('reject')">Reject all</button></div>
<script>
function c(which){ fetch('/__clicked?b=' + which); document.getElementById('banner').remove(); }
</script></body></html>
